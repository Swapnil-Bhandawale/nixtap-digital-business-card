server:
  port: 8083
spring:
  application:
    name: engagement-service
  datasource:
    url: jdbc:mysql://localhost:3306/nixtap_engagement_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
logging:
  level:
    com.nixtap.engagement: DEBUG
